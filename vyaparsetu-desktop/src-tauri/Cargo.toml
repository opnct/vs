[package]
name = "vyaparsetu"
version = "0.1.0"
description = "TallyPrime Engine Desktop App"
authors = ["VyaparSetu"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
chrono = "0.4.44"
