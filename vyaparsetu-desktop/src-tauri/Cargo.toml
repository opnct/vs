[package]
name = "vyaparsetu"
version = "0.1.0"
description = "VyaparSetu Tauri v2 Engine"
authors = ["VyaparSetu"]
edition = "2021"

[build-dependencies]
tauri-build = "2.0.0"

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.29.0", features = ["bundled"] }
chrono = "0.4"
